<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoloDS NextLast v4</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <!-- Registration Screen -->
  <div id="registrationScreen" class="screen">
    <div class="container">
      <div class="brand">
        <h1>Solo<span>DS</span></h1>
        <p class="tagline">NextLast — Private P2P Line</p>
      </div>
      
      <div class="card">
        <h2>Create Your Line</h2>
        
        <div class="input-group">
          <label>Your Name</label>
          <input type="text" id="userName" placeholder="e.g., sushant" maxlength="20">
        </div>
        
        <div class="input-group">
          <label>Partner's Name</label>
          <input type="text" id="partnerName" placeholder="e.g., rahul" maxlength="20">
        </div>
        
        <small class="error" id="error"></small>
        
        <button id="registerBtn" class="btn-main">Create Connection Code</button>
      </div>
      
      <div class="card hidden" id="codeCard">
        <h2>Your Short Code</h2>
        <p class="hint">Share this code with partner</p>
        
        <div class="code-display" id="codeDisplay">GENERATING...</div>
        
        <button id="copyCodeBtn" class="btn-copy">📋 Copy Code</button>
        
        <div class="divider-text">— OR —</div>
        
        <div class="input-group">
          <label>Enter Partner's Code</label>
          <input type="text" id="partnerCode" placeholder="Paste code here" maxlength="100" style="text-transform: uppercase;">
        </div>
        
        <button id="connectBtn" class="btn-main">Connect</button>
      </div>
    </div>
  </div>
  
  <!-- Main Screen -->
  <div id="mainScreen" class="screen hidden">
    <div class="container">
      <div class="header">
        <div class="brand">
          <h1>Solo<span>DS</span></h1>
        </div>
        <div class="user-badge">
          <span id="myNameDisplay"></span>
          <span class="divider">↔</span>
          <span id="partnerNameDisplay"></span>
        </div>
      </div>
      
      <div class="status-pill" id="statusPill">
        <span id="statusText">🔴 Offline</span>
      </div>
      
      <div class="main-grid">
        <div class="card">
          <div class="card-header">
            <h3>💬 Messages</h3>
            <span class="dot" id="chatDot"></span>
          </div>
          <div class="messages" id="messages"></div>
          <div class="msg-input-row">
            <input type="text" id="messageInput" placeholder="Type message...">
            <button id="sendBtn" class="btn-send">Send</button>
          </div>
        </div>
        
        <div class="card">
          <div class="card-header">
            <h3>📞 Voice Call</h3>
          </div>
          <div class="call-area">
            <button id="startCallBtn" class="btn-call">Start Call</button>
            <button id="acceptBtn" class="btn-accept hidden">Accept</button>
            <button id="rejectBtn" class="btn-reject hidden">Reject</button>
            <button id="hangupBtn" class="btn-hangup hidden">End Call</button>
            <p class="call-status" id="callStatus"></p>
            <audio id="remoteAudio" autoplay class="hidden"></audio>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script src="app.js"></script>
</body>
</html>
